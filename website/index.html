<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Onboard — Set up your Mac</title>
    <meta
      name="description"
      content="Set up Field Theory and your assistant. Reuse what already works, then add tools for building when you need them."
    />
    <link rel="icon" href="/icon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f6f5f1;
        color: #242725;
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 640px;
        margin: auto;
        padding: 40px 24px 56px;
      }
      nav {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 70px;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      h1 {
        font-size: clamp(36px, 6vw, 48px);
        font-weight: 500;
        letter-spacing: -1.7px;
        line-height: 1.12;
        margin: 0 0 18px;
      }
      p {
        color: #626760;
        margin: 0 0 20px;
      }
      .primary {
        display: block;
        background: #283e31;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 12px 20px;
        font-weight: 500;
        margin-bottom: 12px;
      }
      .quiet {
        font-size: 13px;
        color: #73786e;
      }
      #feedback:empty {
        display: none;
      }
      #feedback {
        font-size: 14px;
        color: #365940;
        margin: 14px 0;
      }
      details {
        padding: 17px 0;
        border-bottom: 1px solid #dce0d6;
      }
      summary {
        cursor: pointer;
        color: #51584e;
      }
      details p {
        font-size: 14px;
        margin: 16px 0;
      }
      textarea {
        width: 100%;
        min-height: 300px;
        padding: 14px;
        border: 1px solid #ccd1c7;
        border-radius: 8px;
        font:
          13px/1.6 ui-monospace,
          monospace;
        background: #fffefa;
        color: #30362d;
        margin: 14px 0;
        resize: vertical;
      }
      @media (max-width: 600px) {
        main {
          padding: 28px 22px;
        }
        nav {
          margin-bottom: 55px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav><span>onboard.computer</span></nav>
      <h1>Set up your Mac.</h1>
      <p>
        Paste into ChatGPT or Claude. Your assistant will guide you from
        wherever you are.
      </p>
      <button class="primary" id="copy">Copy setup prompt</button>
      <div id="feedback" role="status" aria-live="polite"></div>
      <details id="read-prompt">
        <summary>Show prompt</summary>
        <textarea id="prompt" readonly aria-label="Setup prompt"></textarea>
      </details>
    </main>
    <script src="/setup-prompt.js"></script>
    <script>
      const prompt = document.getElementById("prompt");
      prompt.value = setupPrompt(undefined, undefined, location.origin);
      document.getElementById("copy").onclick = async () => {
        try {
          await navigator.clipboard.writeText(prompt.value);
          document.getElementById("feedback").textContent =
            "Copied. Paste into ChatGPT or Claude to begin.";
        } catch {
          document.getElementById("read-prompt").open = true;
          prompt.focus();
          prompt.select();
          document.getElementById("feedback").textContent =
            "Select and copy the prompt below.";
        }
      };
    </script>
  </body>
</html>
